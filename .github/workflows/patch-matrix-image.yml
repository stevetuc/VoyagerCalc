name: patch-matrix-image
on:
  push:
    paths:
      - .github/workflows/patch-matrix-image.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios12-port
          fetch-depth: 0
      - name: Insert the line
        run: |
          python3 - <<'PY'
          p = "app/Sources/Legacy/LegacyMatrixEditor.swift"
          lines = open(p, encoding="utf-8").read().split("\n")
          hits = [i for i, l in enumerate(lines) if "could not be read (is it running as an HP-15C?)" in l]
          assert len(hits) == 1, hits
          i = hits[0]
          assert "self.image = nil" not in lines[i - 1]
          lines.insert(i, " " * 16 + "self.image = nil")
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          git diff --stat
          git config user.name "VoyagerCalc port"
          git config user.email "port@localhost"
          git commit -am "Keep the matrix editor's image honest when the memory cannot be read"
          git push origin HEAD:ios12-port
